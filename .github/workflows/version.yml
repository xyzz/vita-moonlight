name: Create release

on:
  workflow_dispatch:
    inputs:
      release_mode:
        description: How the next version is selected
        required: true
        default: auto
        type: choice
        options:
          - auto
          - manual
      manual_bump:
        description: Version change used in manual mode
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Update version and create tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release_commit: ${{ steps.commit.outputs.sha }}
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN || github.token }}
          submodules: recursive

      - name: Test release helper
        run: python3 -m unittest discover -s tests

      - name: Calculate and update version
        id: version
        env:
          RELEASE_MODE: ${{ inputs.release_mode }}
          MANUAL_BUMP: ${{ inputs.manual_bump }}
        run: |
          set -euo pipefail
          git fetch --force --tags origin
          previous_tag="$(python3 release.py latest)"
          automatic_version="$(python3 release.py next --bump auto)"

          if [ "$RELEASE_MODE" = "manual" ]; then
            version="$(python3 release.py next --bump "$MANUAL_BUMP")"
            selection="manual ($MANUAL_BUMP)"
          else
            version="$automatic_version"
            selection="auto"
          fi

          python3 release.py update "$version" --previous "$previous_tag"
          python3 release.py verify "$version"

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Preparing Moonlight Vita $version from ${previous_tag:-the initial release}"

          current_version="${previous_tag:-none}"
          {
            echo "## Release version"
            echo
            echo "| Current | Automatic suggestion | Selection | Release |"
            echo "| --- | --- | --- | --- |"
            echo "| \`$current_version\` | \`$automatic_version\` | $selection | \`$version\` |"
            echo
            python3 release.py notes "$version"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create verified release commit
        id: commit
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          release_files=(
            CMakeLists.txt
            CHANGELOG.md
            legacy/CMakeLists.txt
            legacy/CHANGELOG.md
            psv/sce_sys/livearea/contents/template.xml
            resources/changeinfo.xml
            sce_sys/livearea/contents/template.xml
          )

          declare -A allowed
          for path in "${release_files[@]}"; do
            allowed["$path"]=1
          done
          while IFS= read -r path; do
            if [[ -n "$path" && -z "${allowed[$path]+x}" ]]; then
              echo "Unexpected release preparation change: $path" >&2
              exit 1
            fi
          done < <(git diff --name-only)

          expected_head="$(git rev-parse HEAD)"
          mapfile -t changed_files < <(git diff --name-only -- "${release_files[@]}")

          request="$RUNNER_TEMP/create-release-commit.json"
          python3 - "$GITHUB_REPOSITORY" "$DEFAULT_BRANCH" "$expected_head" "$VERSION" "$request" "${changed_files[@]}" <<'PY'
          import base64
          import json
          import sys
          from pathlib import Path

          repository, branch, expected_head, version, output, *paths = sys.argv[1:]
          additions = [
              {
                  "path": path,
                  "contents": base64.b64encode(Path(path).read_bytes()).decode("ascii"),
              }
              for path in paths
          ]
          query = """
          mutation($input: CreateCommitOnBranchInput!) {
            createCommitOnBranch(input: $input) {
              commit {
                oid
                url
                signature {
                  isValid
                  state
                  wasSignedByGitHub
                  signer { login }
                }
              }
            }
          }
          """
          mutation_input = {
              "branch": {
                  "repositoryNameWithOwner": repository,
                  "branchName": branch,
              },
              "expectedHeadOid": expected_head,
              "message": {
                  "headline": f"chore(release): prepare {version}",
              },
          }
          if additions:
              mutation_input["fileChanges"] = {"additions": additions}
          payload = {
              "query": query,
              "variables": {"input": mutation_input},
          }
          Path(output).write_text(json.dumps(payload), encoding="utf-8")
          PY

          result="$(gh api graphql --input "$request")"
          read -r commit_sha signed_by_github signature_valid < <(
            python3 -c '
          import json
          import sys
          data = json.load(sys.stdin)
          commit = ((data.get("data") or {}).get("createCommitOnBranch") or {}).get("commit") or {}
          signature = commit.get("signature") or {}
          print(
              commit.get("oid", ""),
              str(bool(signature.get("wasSignedByGitHub"))).lower(),
              str(bool(signature.get("isValid"))).lower(),
          )
          ' <<<"$result"
          )

          if [[ -z "$commit_sha" || "$signed_by_github" != "true" || "$signature_valid" != "true" ]]; then
            echo "GitHub did not return a valid signed release commit" >&2
            python3 -m json.tool <<<"$result" >&2
            exit 1
          fi

          echo "sha=$commit_sha" >> "$GITHUB_OUTPUT"
          echo "Created GitHub-verified release commit $commit_sha"

      - name: Create release tag
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          RELEASE_COMMIT: ${{ steps.commit.outputs.sha }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$VERSION" >/dev/null 2>&1; then
            echo "Tag $VERSION already exists" >&2
            exit 1
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/$VERSION" \
            -f sha="$RELEASE_COMMIT" >/dev/null

  publish:
    name: Build and publish
    needs: prepare
    runs-on: ubuntu-latest
    env:
      VITASDK: ${{ github.workspace }}/vitasdk
      GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
      RELEASE_COMMIT: ${{ needs.prepare.outputs.release_commit }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          submodules: recursive

      - name: Checkout release tag
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git fetch --force --tags origin
          git fetch origin "$DEFAULT_BRANCH"

          if ! [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Invalid release version: $VERSION" >&2
            exit 1
          fi
          if ! git rev-parse --verify --quiet "refs/tags/$VERSION"; then
            echo "Release tag $VERSION does not exist" >&2
            exit 1
          fi
          tag_commit="$(git rev-parse "$VERSION^{commit}")"
          if [[ "$tag_commit" != "$RELEASE_COMMIT" ]]; then
            echo "Tag $VERSION points to $tag_commit, expected $RELEASE_COMMIT" >&2
            exit 1
          fi
          verified="$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_COMMIT" --jq '.commit.verification.verified')"
          if [[ "$verified" != "true" ]]; then
            echo "Release commit $RELEASE_COMMIT is not verified by GitHub" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$VERSION" "origin/$DEFAULT_BRANCH"; then
            echo "Tag $VERSION is not part of the default branch $DEFAULT_BRANCH" >&2
            exit 1
          fi

          git checkout --detach "$VERSION"
          git submodule sync --recursive
          git submodule update --init --recursive
          python3 release.py verify "$VERSION"

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build git curl wget unzip \
            libarchive-tools pkg-config fakeroot patch python3 bzip2 xz-utils

      - name: Install VitaSDK
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/vitasdk/vdpm.git "$RUNNER_TEMP/vdpm"
          "$RUNNER_TEMP/vdpm/bootstrap-vitasdk.sh" --install-dir "$VITASDK"
          echo "$VITASDK/bin" >> "$GITHUB_PATH"

      - name: Install project dependencies
        run: ./scripts/prepare/install_all.sh

      - name: Build release VPK
        run: ./makepsv --gxm --release --clean --no-deploy

      - name: Smoke-test packaged launcher and frontends
        run: python3 scripts/check_vpk.py cmake-build-psv-linux-gxm/moonlight.vpk

      - name: Prepare release asset and notes
        run: |
          set -euo pipefail
          mkdir -p dist
          cp cmake-build-psv-linux-gxm/moonlight.vpk \
            dist/moonlight.vpk
          python3 release.py notes "$VERSION" > dist/release-notes.md

      - name: Upload build artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: moonlight-vita-${{ needs.prepare.outputs.version }}
          path: dist/moonlight.vpk
          if-no-files-found: error

      - name: Publish GitHub release
        run: |
          set -euo pipefail
          asset="dist/moonlight.vpk"
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" "$asset" --clobber
            gh release edit "$VERSION" \
              --title "$VERSION" \
              --notes-file dist/release-notes.md \
              --latest
          else
            gh release create "$VERSION" "$asset" \
              --verify-tag \
              --title "$VERSION" \
              --notes-file dist/release-notes.md \
              --latest
          fi
